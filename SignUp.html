<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page 2</title>
    <style>
        /* General body styling */
        body {
            background: linear-gradient(135deg, #2b3e50, #4f5d75);
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Styling for the login container */
        .login {
            width: 400px;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.6);
            margin: 100px auto;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            color: white;
            text-align: center;
        }

        /* Logo styling */
        .logo {
            width: 120px;
            margin-bottom: 20px;
        }

        /* Main heading (login text) */
        .login2 {
            font-size: 50px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Form labels and inputs styling */
        .login3 {
            color: #d3d3d3;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .login3 input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
            color: #333;
        }

        .login3 input:focus {
            border-color: #4f5d75;
            outline: none;
        }

        /* Login button and hover effects */
        .login4 {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .login4 button {
            padding: 15px 30px;
            background-color: #4f5d75;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login4 button:hover {
            background-color: #3b4755;
        }

        /* Styling for the "Sign Up" link */
        .login4 a {
            text-decoration: none;
            color: #b0c1c8;
            font-size: 14px;
            margin-top: 10px;
            display: block;
        }

        .login4 a:hover {
            color: #ffffff;
        }

        /* Mobile responsive adjustments */
        @media (max-width: 600px) {
            .login {
                width: 80%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login">
        <!-- Logo Image -->
        <img src="C:\HTML\PROJECT FEE\LOGO .PNG" alt="LOGO" class="logo">
        
        <!-- Form -->
        <form action="#" method="get" target="black">
            <div class="login2">Sign-Up</div>
            
            <div class="login3">
                <label>Name</label>
                <input type="text" placeholder="Enter your Name" required><br>
                <label>Email Address</label>
                <input type="text" placeholder="Enter your email" required><br>
            
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required><br>
                <label>Contact-Number</label>
                <input type="number" placeholder="Enter your Number" required><br>
            </div>
            
            <!-- Login button -->
            <div class="login4">
                <button type="button" onclick="myfunction()">SUBMIT</button>
            </div>

            <!-- Sign Up link -->
            <a href="file:///C:/HTML/PROJECT%20FEE/login%20page.html" id="redirectLink" style="display: none;"></a>
        </form>
    </div>

    <script>
        // Function for login success alert
        function myfunction() {
            alert("Account Created Successfully!");
            // After the alert, redirect to the login page
            window.location.href = "file:///C:/HTML/PROJECT%20FEE/login%20page.html";
        }
    </script>

</body>
</html>
